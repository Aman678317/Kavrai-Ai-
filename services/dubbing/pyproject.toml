[project]
name = "kavrai-dubbing-service"
version = "1.0.0"
description = "Modular Python Dubbing, Licensed Voice Synthesis (CosyVoice 2 / StyleTTS 2), SAG-AFTRA Ledger & WSOLA Conformance Microservice"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
