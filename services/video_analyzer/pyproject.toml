[project]
name = "video-analyzer"
version = "1.0.0"
description = "Kavrai AI Theatrical Scene & Shot Detection, Character Recognition, and SMPTE Indexing Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ai = [
    "scenedetect[opencv]>=0.6.2",
    "mediapipe>=0.10.9",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
