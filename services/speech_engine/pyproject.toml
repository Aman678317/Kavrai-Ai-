[project]
name = "speech-engine"
version = "1.0.0"
description = "Kavrai AI Theatrical Multilingual Speech Recognition, Stem Isolation & Diarization Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ai = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "demucs>=4.0.1",
    "whisperx>=3.1.1",
    "pyannote.audio>=3.1.1",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
